on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6.1.0
      - name: install pnpm
        uses: pnpm/action-setup@v6.0.6
        with:
          version: 10.24.0
          cache: true
      - name: install dependencies
        run: pnpm install
      - name: run tests
        run: pnpm test
